spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate

  liquibase:
    change-log: classpath:liquibase/db.changelog-master.yaml
    enabled: true

  data:
    redis:
      host: localhost
      port: 6379

  cache:
    type: redis

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: 1133

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}

file:
  upload-dir: uploads/books