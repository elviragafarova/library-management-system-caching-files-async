databaseChangeLog:

  - changeSet:
      id: 003-create-categories
      author: Elvira

      changes:

        - createTable:
            tableName: categories
            columns:

              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true